<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SIMRACE · График смен</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

html,body{margin:0}
[hidden]{display:none!important}

/* Layout: mobile-first. Sticky week bar on top; each day is a card with one cell per shift; picker is a bottom sheet that walks through empty slots. Desktop widens into a 7-column pit-wall board. Dark single theme by choice (brand). */
:root{
  --bg:#0f1011;
  --panel:#17181a;
  --panel-2:#1e2023;
  --line:#2a2c30;
  --fg:#ecebe8;
  --muted:#8d8b86;
  --dim:#5c5b58;
  --accent:#f39200;
  --accent-soft:rgba(243,146,0,.12);
  --warn:#e0a83a;
  --bad:#e5533d;
  --ok:#5fae7c;
  --che-bg:#182026;
  --che-hover:#1f2a32;
  --che-line:#6f8ea3;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* sticky week bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:0;font-size:18px;font-weight:600;white-space:nowrap}
.weeknav{display:flex;align-items:center;gap:4px}
.navbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:18px;flex:none}
.weeklabel{min-width:118px;text-align:center;display:flex;flex-direction:column;align-items:center;background:none;border:none;cursor:pointer;padding:0 4px}
.weeklabel b{font-size:14.5px;font-weight:600;white-space:nowrap}
.weeklabel span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.weeklabel span.back{color:var(--accent)}
.menubtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:none}
.menubtn i{display:block;width:16px;height:2px;background:var(--fg);border-radius:1px;box-shadow:0 -5px 0 var(--fg),0 5px 0 var(--fg)}

.main{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}

/* status + filters */
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--ok)}
.dot.off{background:var(--warn)}
.progress{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.progress b{color:var(--fg);font-weight:500}
.tools{display:none;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141414}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;height:48px;font-size:15px}

.filters{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .sw{width:8px;height:8px;border-radius:2px}

/* board — mobile: day cards */
.board{display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.col.labels{display:none}
.col{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.dayhead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.dayhead .dn{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dayhead .dd{font-family:var(--f-mono);font-size:14px}
.dayhead .tg{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.col.today{border-color:rgba(243,146,0,.55)}
.col.today .dn{color:var(--accent)}
.col.weekend .dn{color:var(--fg)}
.cell{border:none;border-left:1px solid var(--line);background:transparent;text-align:left;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;min-height:68px;position:relative}
.cell.first{border-left:none}
.cell:active{background:var(--panel-2)}
.cell .mob{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:7px;min-width:0}
.who .sw{width:8px;height:8px;border-radius:2px;flex:none}
.who .nm{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.empty .nm{color:var(--dim);font-weight:400}
.cell.empty .plus{color:var(--accent);font-weight:600}
.flag{font-size:11.5px;line-height:1.2;color:var(--warn)}
.flag.bad{color:var(--bad)}
.cell.has-bad{box-shadow:inset 0 3px 0 var(--bad)}
.cell.has-warn{box-shadow:inset 0 3px 0 var(--warn)}
.cell.che,.lab.che{background:var(--che-bg)}
.cell.che:active{background:var(--che-hover)}
.lab.che .club,.cell.che .mob{color:var(--che-line)}
.cell.dim .who,.cell.dim .flag{opacity:.28}
.cell.hit{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lab{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-bottom:1px solid var(--line);gap:2px}
.lab .club{font-size:13.5px;font-weight:600}
.lab .slot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
body.ro .cell{cursor:default}
body.ro .cell:active{background:transparent}
body.ro .cell.che:active{background:var(--che-bg)}
body.ro .cell.empty .plus{display:none}

.swipehint{font-size:12px;color:var(--dim);text-align:center}

/* load */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.section-h .hint{font-size:12px;color:var(--dim)}
.load{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:left}
.lrow .who .nm{font-weight:600;font-size:14.5px}
.lrow .h{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lrow .h b{color:var(--fg);font-weight:500}
.bar{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.lrow .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.dim{opacity:.4}
.lrow.on{border-color:var(--accent)}

/* sheets: bottom sheet on phones, dialog on desktop */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;width:100%;max-height:88%;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sh-head{padding:10px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head .e{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sh-head .e.che{color:var(--che-line)}
.sh-head h3{margin:2px 0 0;font-size:18px;font-weight:600}
.sh-head .s{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.x{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1;padding:2px 6px;margin:-4px -6px 0 0}
.opts{display:flex;flex-direction:column;padding:6px 8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;text-align:left}
.opt:active{background:var(--panel-2)}
.opt.sel{background:var(--accent-soft)}
.opt .who .nm{font-size:16px}
.opt .meta{font-size:12.5px;color:var(--muted);text-align:right;flex:none;max-width:55%}
.opt .meta.bad{color:var(--bad)}
.opt .meta.warn{color:var(--warn)}
.sh-foot{padding:10px 16px 14px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1;height:46px;font-size:14.5px}
.remain{font-size:12px;color:var(--muted);padding:0 18px 8px}
.menu{display:flex;flex-direction:column;padding:6px 8px 10px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;justify-content:center;padding:8px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;text-align:left}
.mi:active{background:var(--panel-2)}
.mi b{font-size:15.5px;font-weight:500}
.mi span{font-size:12.5px;color:var(--muted)}
.mi.danger b{color:var(--bad)}
.form{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.form h4{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.frow{display:flex;gap:10px;align-items:center}
.frow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.inp{flex:1;min-width:0;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 12px;color:var(--fg);font:inherit;font-size:16px}
.inp.t{flex:0 0 84px;font-family:var(--f-mono);text-align:center;font-size:16px}
.frow .lbl{flex:1;min-width:0;font-size:14px}
.confirm{padding:16px 18px;color:var(--muted);font-size:14.5px}
.copybox{width:100%;min-height:220px;font-family:var(--f-mono);font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* phones: week nav takes the bar, brand hidden */
@media (max-width:560px){
  .brand{display:none}
  .weeknav{flex:1;justify-content:space-between}
  .weeklabel{flex:1}
  .cell{padding:8px 8px 8px 10px}
  .who{gap:6px}
  .who .nm{font-size:15px}
}
@media (max-width:360px){.who .nm{font-size:14px}.cell .mob{font-size:9.5px}}

/* desktop: 7-column board */
@media (min-width:861px){
  body{font-size:14px}
  .top{position:static;border-bottom:none}
  .top .inner{padding-block:18px 14px;border-bottom:1px solid var(--line);align-items:flex-end}
  .eyebrow{font-size:11px}
  h1{font-size:26px}
  .menubtn{display:none}
  .tools{display:flex}
  .weeklabel{min-width:190px}
  .filters{flex-direction:row;flex-wrap:wrap;gap:10px 20px;align-items:center}
  .seg{margin:0;padding:0}
  .chip{height:30px;font-size:13px}
  .board{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .col,.col.labels{display:grid;grid-template-columns:none;grid-template-rows:46px repeat(var(--n,3),60px);border:none;border-left:1px solid var(--line);border-radius:0;background:transparent;min-width:0}
  .col.labels{border-left:none;background:var(--bg)}
  .col.today{border-color:var(--line)}
  .col.today .dayhead{box-shadow:inset 0 2px 0 var(--accent)}
  .dayhead{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 12px}
  .dayhead .tg{display:none}
  .dayhead .dn{font-size:12px}
  .cell{border-left:none;border-bottom:1px solid var(--line);min-height:0;padding:6px 12px;gap:2px}
  .cell:last-child,.lab:last-child{border-bottom:none}
  .cell .mob{display:none}
  .cell:hover{background:var(--panel-2)}
  .cell.che:hover{background:var(--che-hover)}
  body.ro .cell:hover{background:transparent}
  body.ro .cell.che:hover{background:var(--che-bg)}
  .cell.grp,.lab.grp{box-shadow:inset 0 1px 0 var(--dim)}
  .cell.has-bad{box-shadow:inset 3px 0 0 var(--bad)}
  .cell.has-warn{box-shadow:inset 3px 0 0 var(--warn)}
  .who .nm{font-size:15px}
  .swipehint{display:none}
  .load{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .scrim{align-items:center;padding:16px}
  .sheet{width:min(420px,100%);border-radius:14px;border-bottom:1px solid var(--line);max-height:calc(100% - 32px)}
  .sheet.wide{width:min(560px,100%)}
  .grab{display:none}
  .sh-head{padding-top:16px}
  .sh-foot{justify-content:flex-end}
  .sh-foot .btn{flex:0 0 auto;height:36px;font-size:13.5px}
  .opt{min-height:44px}
  .opt:hover,.mi:hover{background:var(--panel-2)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.banner{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13.5px}
.banner span{color:var(--muted)}
code{font-family:var(--f-mono);color:var(--fg);background:var(--panel-2);padding:1px 6px;border-radius:5px;user-select:all}
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-in{max-width:340px;display:flex;flex-direction:column;gap:8px}
.gate h2{margin:0;font-size:22px;font-weight:600}
.gate p{margin:0;color:var(--muted);font-size:15px}

:root{--s-bd:#f39200;--s-bn:#a8640f;--s-cd:#7d9db1}
.banner{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13.5px}
.banner span{color:var(--muted)}
code{font-family:var(--f-mono);color:var(--fg);background:var(--panel-2);padding:1px 6px;border-radius:5px;user-select:all}
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-in{max-width:340px;display:flex;flex-direction:column;gap:8px}
.gate h2{margin:0;font-size:22px;font-weight:600}
.gate p{margin:0;color:var(--muted);font-size:15px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tab{height:38px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14.5px;cursor:pointer}
.tab.on{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
@media (min-width:861px){.tabs{max-width:360px}}

/* deadline */
.deadline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px}
.deadline b{font-weight:600}
.deadline .dl-s{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.deadline.warn{border-color:rgba(224,168,58,.6)}.deadline.warn .dl-s{color:var(--warn)}
.deadline.bad{border-color:rgba(229,83,61,.6)}.deadline.bad .dl-s{color:var(--bad)}
.deadline.ok .dl-s{color:var(--ok)}

/* table view */
.ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.modeseg{display:flex;padding:3px;gap:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.modeseg button{height:34px;padding:0 14px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.modeseg button.on{background:var(--fg);color:var(--bg)}
.modeseg button.on.assign{background:var(--accent);color:#141414}
.ttools .right{display:flex;gap:8px;flex-wrap:wrap}
.autochip{height:34px;padding:0 12px;border-radius:17px;border:1px dashed var(--fg);background:transparent;cursor:pointer;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-grid;place-items:center;min-width:26px;height:18px;padding:0 4px;border-radius:4px;font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:600}
.modehint{font-size:12.5px;color:var(--dim)}

.tbl-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.tbl-wrap::-webkit-scrollbar{display:none}
.tbl{display:grid;grid-template-columns:minmax(76px,96px) repeat(7,minmax(32px,1fr)) minmax(40px,58px);border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;min-width:min-content}
.tbl>*{min-width:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.tbl>.c0{border-left:none}
.tbl>.lastrow{border-bottom:none}
.t-corner{background:var(--bg)}
.t-h{background:var(--bg);border-top:none;border-right:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:46px;cursor:pointer;padding:0;color:var(--muted)}
.t-h b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.t-h span{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.t-h.today b{color:var(--accent)}
.t-h.focus{background:var(--accent-soft);color:var(--fg)}
.t-h.focus b{color:var(--accent)}
.t-th{background:var(--bg);display:grid;place-items:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.t-name{display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;height:46px;font-size:13px;font-weight:500;background:var(--panel)}
.t-name .sw{width:7px;height:7px;border-radius:2px;flex:none}
.t-name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-name.low .nm{color:var(--warn)}
.t-c{height:46px;border-top:none;border-right:none;border-bottom-style:solid;background:transparent;padding:3px;cursor:pointer;display:grid;place-items:center;position:relative}
.t-c .lbl{display:grid;place-items:center;width:100%;height:100%;border-radius:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.02em;line-height:1}
.t-c:active .lbl{filter:brightness(1.15)}
.t-c.today{background:rgba(243,146,0,.04)}
.lbl.as-bol-d{background:var(--s-bd);color:#151515}
.lbl.as-bol-n{background:var(--s-bn);color:#fff6ea}
.lbl.as-che-d{background:var(--s-cd);color:#0f1418}
.lbl.w-bol-d{background:rgba(243,146,0,.13);color:#f2b45e;box-shadow:inset 0 0 0 1px rgba(243,146,0,.35)}
.lbl.w-bol-n{background:rgba(168,100,15,.2);color:#d9a35a;box-shadow:inset 0 0 0 1px rgba(168,100,15,.5)}
.lbl.w-che-d{background:rgba(125,157,177,.14);color:#a6c0d0;box-shadow:inset 0 0 0 1px rgba(125,157,177,.4)}
.lbl.w-any{background:rgba(95,174,124,.13);color:#8fcca4;box-shadow:inset 0 0 0 1px rgba(95,174,124,.4)}
.lbl.w-no{background:rgba(229,83,61,.1);color:#e5533d;box-shadow:inset 0 0 0 1px rgba(229,83,61,.35)}
.lbl.auto{outline:1.5px dashed rgba(255,255,255,.85);outline-offset:-4px}
.t-c .dotbad{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--panel)}
.t-c .dotwarn{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.t-tot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;font-family:var(--f-mono);font-size:12px;line-height:1.15;background:var(--panel)}
.t-tot b{font-size:13px;font-weight:500}
.t-tot span{color:var(--muted);font-size:10.5px}
.t-tot.low b{color:var(--warn)}
.t-cov{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;height:44px;background:var(--bg)}
.t-cov i{display:block;width:24px;height:6px;border-radius:2px}
.t-cov i.f-bol-d{background:var(--s-bd)}.t-cov i.f-bol-n{background:var(--s-bn)}.t-cov i.f-che-d{background:var(--s-cd)}
.t-cov i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.t-covlab{display:flex;align-items:center;padding:0 8px;height:44px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:var(--bg)}
.tbl.focus .t-c.notfree .lbl,.tbl.focus .t-c.notfree{opacity:.28}
.tbl.focus .t-c.free{box-shadow:inset 0 0 0 2px var(--accent)}
.freebar{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13.5px}
.freebar .fb-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.freebar b{font-weight:600}
.freebar .x{font-size:22px;margin:0}
.freebar .names{color:var(--fg)}
.freebar .holes{color:var(--muted);font-size:12.5px}

/* sheet extras */
.wishgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.wbtn{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 12px;text-align:left}
.wbtn b{font-size:15px;font-weight:600}
.wbtn span{font-size:12px;color:var(--muted)}
.wbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.wbtn .tagl{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px}
.wbtn.full{grid-column:1/-1}
.slotopt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;text-align:left;width:100%}
.slotopt:active{background:var(--panel-2)}
.slotopt.sel{background:var(--accent-soft)}
.slotopt .l{display:flex;align-items:center;gap:10px;min-width:0}
.slotopt .l i{display:inline-grid;place-items:center;min-width:34px;height:24px;border-radius:5px;font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-weight:600;flex:none}
.slotopt .t b{display:block;font-size:15px;font-weight:500}
.slotopt .t span{font-size:12.5px;color:var(--muted)}
.slotopt .r{font-size:12.5px;color:var(--muted);text-align:right;flex:none;max-width:45%}
.slotopt .r.bad{color:var(--bad)}.slotopt .r.warn{color:var(--warn)}.slotopt .r.wish{color:var(--ok)}
.sg-list{display:flex;flex-direction:column;gap:2px;padding:6px 18px 12px;font-size:14px}
.sg-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sg-row:last-child{border-bottom:none}
.sg-row span{color:var(--muted);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.sg-sum{padding:12px 18px 0;font-size:14.5px}
.sg-sum b{font-weight:600}
.sg-holes{margin:8px 18px 0;padding:10px 12px;border-radius:10px;border:1px solid rgba(229,83,61,.45);font-size:13px;display:flex;flex-direction:column;gap:6px}
.sg-holes b{color:var(--bad);font-weight:600}
.sg-holes span{color:var(--muted)}
.toast{display:flex;align-items:center;gap:14px;width:max-content;text-align:left}
.toast button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:14px}
@media (max-width:560px){.t-name .sw{display:none}}
@media (min-width:861px){.tbl{grid-template-columns:120px repeat(7,minmax(70px,1fr)) 80px}.t-c .lbl{font-size:12px}.t-name{font-size:14px;padding:0 12px}.t-c:hover .lbl{filter:brightness(1.12)}}
</style>

<body>
<header class="top gut">
  <div class="inner">
    <div class="brand">
      <span class="eyebrow">SIMRACE</span>
      <h1>График смен</h1>
    </div>
    <div class="weeknav">
      <button class="navbtn" id="prev" aria-label="Предыдущая неделя">‹</button>
      <button class="weeklabel" id="wkBtn" aria-label="Вернуться к текущей неделе"><b id="wkTitle">—</b><span id="wkSub">—</span></button>
      <button class="navbtn" id="next" aria-label="Следующая неделя">›</button>
    </div>
    <button class="menubtn" id="menuBtn" aria-label="Действия"><i></i></button>
  </div>
</header>

<div class="gut">
  <div class="inner main">
    <div class="banner" id="setupBanner" hidden></div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tabTable" role="tab">Табло</button>
      <button class="tab" id="tabShifts" role="tab">Смены</button>
    </div>

    <div class="deadline" id="deadline" hidden></div>

    <!-- ========== TABLE VIEW ========== -->
    <section id="viewTable" style="display:flex;flex-direction:column;gap:12px">
      <div class="ttools">
        <div class="modeseg" role="group" aria-label="Режим">
          <button id="mWish">Дано</button>
          <button id="mAssign" class="assign">Назначаю</button>
        </div>
        <div class="right">
          <button class="autochip" id="autoChip" hidden></button>
          <button class="btn primary" id="suggestBtn">Предложить график</button>
        </div>
      </div>
      <div class="modehint" id="modeHint"></div>
      <div class="freebar" id="freeBar" hidden></div>
      <div class="tbl-wrap"><div class="tbl" id="tbl"></div></div>
      <div class="legend" id="legend"></div>
    </section>

    <!-- ========== SHIFTS VIEW ========== -->
    <section id="viewShifts" style="display:flex;flex-direction:column;gap:14px">
      <div class="statusrow">
        <div class="tools" id="tools">
          <button class="btn" id="copyPrev">Перенести с прошлой недели</button>
          <button class="btn" id="exportTg">Текст для Telegram</button>
          <button class="btn" id="team">Команда и смены</button>
          <button class="btn danger" id="clearWk">Очистить неделю</button>
        </div>
        <span class="progress" id="progress"></span>
      </div>
      <div class="filters">
        <div class="seg" id="fClub" aria-label="Фильтр по точке"></div>
        <div class="seg" id="fAdm" aria-label="Фильтр по администратору"></div>
      </div>
      <main class="board" id="board" aria-label="Смены на неделю"></main>
      <div class="swipehint">Листайте недели свайпом влево и вправо</div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="section-h"><h2>Нагрузка за неделю</h2><span class="hint">Красная метка — пересечение смен, жёлтая — мало отдыха между сменами</span></div>
      <div class="load" id="load"></div>
    </section>

    <div class="status"><span class="dot" id="sdot"></span><span id="stext">Загрузка…</span></div>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <div class="gate-in">
    <span class="eyebrow">SIMRACE</span>
    <h2 id="gateTitle">График смен</h2>
    <p id="gateText"></p>
  </div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  const INIT=tg?tg.initData:"";
  // Without a PHP server (GitHub Pages, local file) data lives on this device only.
  const LOCAL=/github\.io$/.test(location.hostname)||location.protocol==="file:";
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#0f1011");tg.setBackgroundColor("#0f1011");if(tg.setBottomBarColor)tg.setBottomBarColor("#0f1011");if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(_){}}
  const haptic={
    tap(){try{tg&&tg.HapticFeedback.selectionChanged()}catch(_){}},
    ok(){try{tg&&tg.HapticFeedback.notificationOccurred("success")}catch(_){}},
    err(){try{tg&&tg.HapticFeedback.notificationOccurred("error")}catch(_){}}
  };

  const PALETTE=["#f39200","#7fa7c9","#b9a37a","#8fb996","#c98f8f","#a99bc9","#cfcfcf"];
  const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  const DOW_FULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
  const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const SHORT_MOB={"Большакова":"Бол","Чернышевского":"Черн"};
  const WISH_TAG={"bol-d":"Б·Д","bol-n":"Б·Н","che-d":"Ч·Д","any":"✓","no":"✕"};
  const REST_MIN=600; // 10 h between shifts

  let team={admins:[],slots:[]}, cells={}, wish={}, auto={}, loaded=false;
  let weekStart=mondayOf(new Date());
  let canWrite=false, scrolledToday=false, reqSeq=0, writing=0;
  let fClub="all", fAdmin=null, view="table", mode="wish", focusDay=null;
  try{const v=JSON.parse(localStorage.getItem("sr-filters")||"{}");if(v.club)fClub=v.club;if(v.admin)fAdmin=v.admin;if(v.view)view=v.view;if(v.mode)mode=v.mode}catch(_){}
  function saveF(){try{localStorage.setItem("sr-filters",JSON.stringify({club:fClub,admin:fAdmin,view,mode}))}catch(_){}}

  function clone(o){return JSON.parse(JSON.stringify(o))}
  function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function ddmm(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")}
  function days(){return Array.from({length:7},(_,i)=>addDays(weekStart,i))}
  function key(d,slotId){return iso(d)+"_"+slotId}
  function wkey(d,adminId){return iso(d)+"_"+adminId}
  function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
  function mins(s){const m=/^(\d{1,2}):(\d{2})$/.exec(s||"");return m?(+m[1])*60+(+m[2]):null}
  function hoursOf(slot){const a=mins(slot.from),b=mins(slot.to);if(a==null||b==null)return 12;let d=b-a;if(d<=0)d+=1440;return d/60}
  function interval(dayIdx,slot){const a=mins(slot.from)??600;let b=mins(slot.to)??1320;if(b<=a)b+=1440;return[dayIdx*1440+a,dayIdx*1440+b]}
  function admin(id){return team.admins.find(a=>a.id===id)}
  function slotById(id){return team.slots.find(s=>s.id===id)}
  function color(id){const i=team.admins.findIndex(a=>a.id===id);return PALETTE[(i<0?0:i)%PALETTE.length]}
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
  function get(d,slotId,src){return (src||cells)[key(d,slotId)]||null}
  function clubs(){return[...new Set(team.slots.map(s=>s.short))]}
  function vis(){return fClub==="all"?team.slots:team.slots.filter(s=>s.short===fClub)}
  function isChe(s){return s.id.startsWith("che")}
  function isCurrentWeek(){return iso(weekStart)===iso(mondayOf(new Date()))}
  function slotTag(s){return WISH_TAG[s.id]||((SHORT_MOB[s.short]||s.short).slice(0,1)+"·"+s.label.slice(0,1))}
  function slotName(s){return s.short+", "+s.label.toLowerCase()}
  function wishOf(d,aId){return wish[wkey(d,aId)]||null}
  function adminDaySlot(d,aId,src){for(const s of team.slots)if(get(d,s.id,src)===aId)return s;return null}

  // ---------- storage ----------
  const SEED={"ver": 3, "team": {"admins": [{"id": "a1", "name": "Виктор"}, {"id": "a2", "name": "Роман"}, {"id": "a3", "name": "Максим"}, {"id": "a4", "name": "Даниил"}, {"id": "a5", "name": "Александр"}, {"id": "a6", "name": "Егор"}, {"id": "a7", "name": "Макар"}], "slots": [{"id": "bol-d", "club": "Большакова, 99А", "short": "Большакова", "label": "День", "from": "10:00", "to": "22:00"}, {"id": "bol-n", "club": "Большакова, 99А", "short": "Большакова", "label": "Ночь", "from": "22:00", "to": "10:00"}, {"id": "che-d", "club": "Чернышевского, 4А", "short": "Чернышевского", "label": "День", "from": "10:00", "to": "22:00"}]}, "weeks": {"2026-10-19": {"cells": {"2026-10-19_bol-d": "a6", "2026-10-19_bol-n": "a7", "2026-10-19_che-d": "a4", "2026-10-20_bol-d": "a5", "2026-10-20_bol-n": "a7", "2026-10-20_che-d": "a4", "2026-10-21_bol-d": "a1", "2026-10-21_bol-n": "a7", "2026-10-21_che-d": "a4", "2026-10-22_bol-d": "a1", "2026-10-22_bol-n": "a7", "2026-10-22_che-d": "a5", "2026-10-23_bol-d": "a1", "2026-10-23_bol-n": "a6", "2026-10-23_che-d": "a5", "2026-10-24_bol-d": "a5", "2026-10-24_bol-n": "a6", "2026-10-24_che-d": "a1", "2026-10-25_bol-d": "a3", "2026-10-25_bol-n": "a7", "2026-10-25_che-d": "a2"}, "wish": {}, "auto": {}}, "2026-10-26": {"cells": {"2026-10-26_bol-d": "a3", "2026-10-26_bol-n": "a7", "2026-10-26_che-d": "a1", "2026-11-01_bol-d": "a4", "2026-11-01_bol-n": "a3", "2026-11-01_che-d": "a1"}, "wish": {"2026-11-01_a4": "bol-d", "2026-11-01_a3": "bol-n", "2026-11-01_a1": "che-d"}, "auto": {}}, "2026-11-02": {"cells": {"2026-11-02_bol-d": "a4", "2026-11-02_bol-n": "a3", "2026-11-03_bol-d": "a4", "2026-11-03_bol-n": "a7", "2026-11-03_che-d": "a1", "2026-11-04_bol-d": "a4", "2026-11-04_bol-n": "a7", "2026-11-04_che-d": "a1", "2026-11-05_bol-d": "a1", "2026-11-05_bol-n": "a7", "2026-11-05_che-d": "a2", "2026-11-06_bol-d": "a5", "2026-11-06_bol-n": "a7", "2026-11-06_che-d": "a6", "2026-11-07_bol-d": "a3", "2026-11-07_bol-n": "a7", "2026-11-07_che-d": "a6"}, "wish": {"2026-11-02_a4": "bol-d", "2026-11-03_a4": "bol-d", "2026-11-04_a4": "bol-d", "2026-11-02_a3": "bol-n", "2026-11-07_a3": "bol-d", "2026-11-03_a7": "bol-n", "2026-11-04_a7": "bol-n", "2026-11-05_a7": "bol-n", "2026-11-06_a7": "bol-n", "2026-11-07_a7": "bol-n", "2026-11-03_a1": "che-d", "2026-11-04_a1": "che-d", "2026-11-05_a1": "bol-d", "2026-11-05_a2": "che-d", "2026-11-06_a5": "bol-d", "2026-11-06_a6": "che-d", "2026-11-07_a6": "che-d", "2026-11-03_a5": "any", "2026-11-03_a6": "any", "2026-11-04_a5": "any", "2026-11-04_a6": "any", "2026-11-05_a5": "any", "2026-11-05_a6": "any"}, "auto": {}}}};
  function ldb(){
    let v=null;try{v=JSON.parse(localStorage.getItem("sr-demo")||"null")}catch(_){}
    if(!v||!v.team){v=clone(SEED);lsave(v);return v}
    Object.keys(v.weeks||{}).forEach(w=>{const x=v.weeks[w];if(x&&!x.cells)v.weeks[w]={cells:x,wish:{},auto:{}}});
    if((v.ver||1)<SEED.ver){
      Object.keys(SEED.weeks).forEach(w=>{const cur=v.weeks[w]||{cells:{},wish:{},auto:{}},sd=SEED.weeks[w];
        v.weeks[w]={cells:Object.assign({},sd.cells||{},cur.cells||{}),wish:Object.assign({},sd.wish||{},cur.wish||{}),auto:cur.auto||{}}});
      v.ver=SEED.ver;lsave(v);
    }
    return v;
  }
  function lsave(v){try{localStorage.setItem("sr-demo",JSON.stringify(v))}catch(_){}}
  function lweek(db,w){const x=db.weeks[w]||{};return{cells:x.cells||{},wish:x.wish||{},auto:x.auto||{}}}
  async function localApi(action,p){
    const db=ldb();p=p||{};
    if(action==="state"){const w=lweek(db,p.week);return{team:db.team,cells:w.cells,wish:w.wish,auto:w.auto,canEdit:true,setup:false,me:{id:0}}}
    if(action==="setTeam"){db.team=p.team;lsave(db);return{team:db.team}}
    const w=lweek(db,p.week);
    if(action==="setCell"){if(p.admin)w.cells[p.key]=p.admin;else delete w.cells[p.key];delete w.auto[p.key]}
    else if(action==="setWish"){if(p.value)w.wish[p.key]=p.value;else delete w.wish[p.key]}
    else if(action==="setWeek"){w.cells=p.cells||{};w.auto=p.auto||{}}
    else throw new Error("Неизвестное действие");
    db.weeks[p.week]=w;lsave(db);return w;
  }
  async function api(action,payload){
    if(LOCAL)return localApi(action,payload);
    const r=await fetch("api.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({initData:INIT,action},payload||{}))});
    let j={};try{j=await r.json()}catch(_){}
    if(!r.ok){const e=new Error(j.error||"Ошибка сервера");e.status=r.status;e.body=j;throw e}
    return j;
  }

  // ---------- rules ----------
  function analyze(src){
    src=src||cells;const ds=days(), res={}, byAdmin={};
    ds.forEach((d,i)=>team.slots.forEach(s=>{const a=get(d,s.id,src);if(!a)return;(byAdmin[a]=byAdmin[a]||[]).push({k:key(d,s.id),iv:interval(i,s),slot:s})}));
    Object.values(byAdmin).forEach(list=>{
      list.sort((x,y)=>x.iv[0]-y.iv[0]);
      for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
        const A=list[i],B=list[j];
        if(B.iv[0]<A.iv[1]){mark(res,A.k,"bad","Пересечение: "+B.slot.short+" "+B.slot.label.toLowerCase());mark(res,B.k,"bad","Пересечение: "+A.slot.short+" "+A.slot.label.toLowerCase())}
        else if(B.iv[0]-A.iv[1]<REST_MIN){mark(res,B.k,"warn",B.iv[0]===A.iv[1]?"24 часа подряд":"Мало отдыха")}
      }
    });
    return res;
  }
  function mark(r,k,lvl,txt){if(!r[k]||r[k].lvl!=="bad")r[k]={lvl,txt}}
  // conflict of putting adminId into (dayIdx,slot) against src, ignoring that same cell and same-day slots of that admin listed in ignore
  function conflictFor(adminId,dayIdx,slot,src,ignoreSameDay){
    const iv=interval(dayIdx,slot);let lvl=null,txt="";
    days().forEach((d,i)=>team.slots.forEach(s=>{
      if(i===dayIdx&&s.id===slot.id)return;
      if(ignoreSameDay&&i===dayIdx)return;
      if(get(d,s.id,src)!==adminId)return;
      const o=interval(i,s);
      if(o[0]<iv[1]&&iv[0]<o[1]){lvl="bad";txt=`Занят: ${DOW[i]}, ${(SHORT_MOB[s.short]||s.short).toLowerCase()} ${s.label.toLowerCase()}`}
      else if(lvl!=="bad"&&Math.min(Math.abs(iv[0]-o[1]),Math.abs(o[0]-iv[1]))<REST_MIN){lvl="warn";txt=`Мало отдыха: ${DOW[i]}, ${s.label.toLowerCase()}`}
    }));
    return{lvl,txt};
  }
  function weekStats(src){
    src=src||cells;const st={};team.admins.forEach(a=>st[a.id]={h:0,n:0,nights:0,clubs:new Set()});
    days().forEach(d=>team.slots.forEach(s=>{const a=get(d,s.id,src);if(a&&st[a]){st[a].h+=hoursOf(s);st[a].n++;if(s.label==="Ночь")st[a].nights++;st[a].clubs.add(s.short)}}));
    return st;
  }
  function weekHours(adminId){return weekStats()[adminId]?.h||0}
  function freeOnDay(dayIdx){
    const d=days()[dayIdx];
    return team.admins.filter(a=>{
      if(wishOf(d,a.id)==="no")return false;

    const total=7*team.slots.length;let filled=0;days().forEach(d=>team.slots.forEach(s=>{if(admin(get(d,s.id)))filled++}));
    const left=Math.round((dl-today)/864e5);
    let cls="",st="";
    if(filled===total&&total){cls="ok";st="Готово"}
    else if(left<0){cls="bad";st=today>=weekStart?"Неделя идёт":"Срок прошёл"}
    else if(left===0){cls="bad";st="Срок сегодня"}

  // --- shifts: slot picker
  function busyInfo(adminId,dayIdx,slot){return conflictFor(adminId,dayIdx,slot,cells,false)}
  function emptySlots(){const out=[];days().forEach((d,i)=>vis().forEach(s=>{if(!admin(get(d,s.id)))out.push([i,s.id])}));return out}
  function nextEmpty(dayIdx,slotId){
    const order=[];days().forEach((d,i)=>vis().forEach(s=>order.push([i,s.id])));
    const pos=order.findIndex(([i,s])=>i===dayIdx&&s===slotId);
    for(let n=1;n<order.length;n++){const [i,s]=order[(pos+n)%order.length];if(!admin(get(days()[i],s)))return[i,s]}
    return null;
  }
  function openCell(dayIdx,slotId){
    if(!canWrite)return;
    haptic.tap();
    const d=days()[dayIdx], s=slotById(slotId), cur=get(d,slotId), wasEmpty=!admin(cur);
    const left=emptySlots().length;
    const rank=a=>{const w=wishOf(d,a.id);return w===slotId?0:w==="any"?1:!w?2:w==="no"?4:3};
    const list=team.admins.slice().sort((x,y)=>rank(x)-rank(y));
    const opts=list.map(a=>{const b=busyInfo(a.id,dayIdx,s);const w=wishOf(d,a.id);
      const meta=b.lvl?esc(b.txt):w==="no"?"Не может":w===slotId?"По «дано» · "+fmtH(weekHours(a.id))+" ч":w==="any"?"Может · "+fmtH(weekHours(a.id))+" ч":fmtH(weekHours(a.id))+" ч";

      return `<button class="opt${a.id===cur?" sel":""}" data-a="${a.id}"><span class="who"><span class="sw" style="background:${color(a.id)}"></span><span class="nm">${esc(a.name)}</span></span><span class="meta ${mc}" ${mc==="ok"?'style="color:var(--ok)"':""}>${meta}</span></button>`}).join("");

      ${wasEmpty&&left>1?`<div class="remain">Пустых смен на неделе: ${left}. После выбора откроется следующая.</div>`:""}
      <div class="sh-foot">${!wasEmpty?'<button class="btn danger" id="clr">Снять со смены</button>':""}${wasEmpty&&left>1?'<button class="btn" id="skip">Пропустить</button>':""}<button class="btn" data-close>Готово</button></div>`);

  // ---------- suggest ----------
  // Fills only empty slots, keeps everything already assigned ("дано" first).
  // Candidates: people marked for this slot or "любая"; never "не может"; no overlaps, ≥10 h rest, one shift a day.
  // Order: most constrained slot first; pick exact wish > "любая", then fewer hours this week.
  function computeSuggestion(){
    const ds=days(), work=Object.assign({},cells), added={};
    const empties=[];ds.forEach((d,i)=>team.slots.forEach(s=>{if(!admin(get(d,s.id,work)))empties.push({i,d,s})}));
    const cands=e=>team.admins.filter(a=>{
      const w=wishOf(e.d,a.id);if(!(w===e.s.id||w==="any"))return false;
      if(adminDaySlot(e.d,a.id,work))return false;
      return !conflictFor(a.id,e.i,e.s,work,false).lvl;
    });
    let open=empties.slice();
    while(open.length){
      let best=null,bc=null;
      for(const e of open){const c=cands(e);if(!c.length)continue;if(!best||c.length<bc.length){best=e;bc=c}}
      if(!best)break;
      const st=weekStats(work);
      bc.sort((x,y)=>{const wx=wishOf(best.d,x.id)===best.s.id?0:1,wy=wishOf(best.d,y.id)===best.s.id?0:1;return wx-wy||st[x.id].h-st[y.id].h||st[x.id].n-st[y.id].n});
      const pick=bc[0], k=key(best.d,best.s.id);
      work[k]=pick.id;added[k]=pick.id;
      open=open.filter(e=>e!==best);
    }
    const holes=open.map(e=>({i:e.i,d:e.d,s:e.s,free:team.admins.filter(a=>wishOf(e.d,a.id)!=="no"&&!adminDaySlot(e.d,a.id,work)&&!conflictFor(a.id,e.i,e.s,work,false).lvl)}));
    return{work,added,holes};
  }
  function openSuggest(){
    if(!canWrite)return;
    const {work,added,holes}=computeSuggestion();
    const keys=Object.keys(added).sort();
    const rows=keys.map(k=>{const [dt,sid]=[k.slice(0,10),k.slice(11)];const i=days().findIndex(d=>iso(d)===dt);const s=slotById(sid);
      return `<div class="sg-row"><div>${esc(admin(added[k]).name)} <span style="color:var(--muted)">— ${esc(slotName(s))}</span></div><span>${DOW[i]} ${ddmm(days()[i])}</span></div>`}).join("");
    const holesHtml=holes.length?`<div class="sg-holes"><b>Не закрыто: ${holes.length}</b>${holes.map(h=>`<div>${DOW[h.i]} ${ddmm(h.d)}, ${esc(slotName(h.s))}<br><span>${h.free.length?"Можно спросить: "+h.free.map(a=>esc(a.name)).join(", "):"Свободных нет"}</span></div>`).join("")}</div>`:"";
    const st=weekStats(work);
    const loadLine=team.admins.map(a=>`${esc(a.name)} ${fmtH(st[a.id].h)}`).join(" · ");
    openModal(head("Автоподбор","Предложение на неделю","Уже назначенное не меняется")+
      `<div class="sg-sum">${keys.length?`Предлагаю закрыть <b>${keys.length}</b> ${plural(keys.length,"смену","смены","смен")} по «дано».`:"По отметкам «дано» больше некого поставить."}</div>
      ${holesHtml}
      ${keys.length?`<div class="sg-list">${rows}</div><div class="remain">Часы после подбора: ${loadLine}</div>`:""}
      <div class="sh-foot"><button class="btn" data-close>${keys.length?"Отмена":"Закрыть"}</button>${keys.length?'<button class="btn primary" id="sgApply">Применить</button>':""}</div>`,true);
    const ap=$("sgApply");if(ap)ap.addEventListener("click",async()=>{
      const snap=snapshot();close();
      const na=Object.assign({},auto);keys.forEach(k=>na[k]=true);
      if(await setWeek(work,na)){haptic.ok();toast(`Добавлено смен: ${keys.length}`,"Отменить",()=>restore(snap))}
    });
  }
  function approveAuto(){const snap=snapshot();setWeek(cells,{}).then(ok=>{if(ok)toast("Смены утверждены","Отменить",()=>restore(snap))})}

  // ---------- menu / team / export ----------
  function openMenu(){
    const ro=!canWrite;
    const items=[
      !ro&&["suggest","Предложить график","Заполнить пустые смены по «дано»"],
      !ro&&["copyPrev","Перенести с прошлой недели","Скопировать назначения на эту неделю"],
      ["exportTg","Отправить график в чат","Текстом, в любой чат Telegram"],
      !ro&&["team","Команда и смены","Имена администраторов и время смен"],
      !isCurrentWeek()&&["thisWeek","К текущей неделе",""],
      !ro&&["clearWish","Очистить «дано» недели","Удалить все отметки, смены останутся"],
      !ro&&["clearWk","Очистить смены недели","Удалить все назначения, «дано» останется","danger"]
    ].filter(Boolean);
    openModal(head("Действия",esc($("wkTitle").textContent))+
      `<div class="menu">${items.map(([id,t,s,cl])=>`<button class="mi ${cl||""}" data-act="${id}"><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:""}</button>`).join("")}</div>`);
    root.querySelectorAll(".mi").forEach(b=>b.addEventListener("click",()=>{close();ACT[b.dataset.act]()}));
  }
  function openTeam(){
    const rows=team.admins.map((a,i)=>`<div class="frow"><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span><input class="inp" id="adm-${a.id}" value="${esc(a.name)}" maxlength="40" aria-label="Имя администратора ${i+1}"></div>`).join("");
    const slots=team.slots.map(s=>`<div class="frow"><span class="lbl">${esc(s.short)} · ${esc(s.label)}</span><input class="inp t" id="from-${s.id}" value="${esc(s.from)}" inputmode="numeric" aria-label="Начало"><input class="inp t" id="to-${s.id}" value="${esc(s.to)}" inputmode="numeric" aria-label="Конец"></div>`).join("");
    openModal(head("Настройки","Команда и смены")+
      `<div class="form"><h4>Администраторы</h4>${rows}<h4>Время смен</h4>${slots}</div>
      <div class="sh-foot"><button class="btn" data-close>Отмена</button><button class="btn primary" id="saveTeam">Сохранить</button></div>`,true);
    $("saveTeam").addEventListener("click",async()=>{
      const t=clone(team);
      t.admins.forEach(a=>{const v=$("adm-"+a.id).value.trim();if(v)a.name=v});
      for(const s of t.slots){const f=$("from-"+s.id).value.trim(),to=$("to-"+s.id).value.trim();
        if(mins(f)==null||mins(to)==null){toast("Время в формате ЧЧ:ММ, например 10:00");return}s.from=f;s.to=to}
      const old=team;team=t;render();close();
      try{const r=await api("setTeam",{team:t});team=r.team;render();haptic.ok();toast("Сохранено")}catch(e){team=old;render();fail(e)}
    });
  }
  function confirmBox(title,text,okLabel,fn){
    openModal(`<div class="sh-head"><div><h3>${esc(title)}</h3></div><button class="x" data-close aria-label="Закрыть">×</button></div><div class="confirm">${esc(text)}</div><div class="sh-foot"><button class="btn" data-close>Отмена</button><button class="btn primary" id="ok">${esc(okLabel)}</button></div>`);
    $("ok").addEventListener("click",()=>{close();fn()});
  }
  function weekText(){
    const ds=days();let t=`SIMRACE · График смен ${$("wkTitle").textContent}\n`;
    ds.forEach((d,i)=>{t+=`\n${DOW[i]} ${ddmm(d)}\n`;
      team.slots.forEach(s=>{const a=admin(get(d,s.id));t+=`${s.short} ${s.label.toLowerCase()} (${s.from}–${s.to}): ${a?a.name:"—"}\n`})});
    return t;
  }
  function exportText(){
    const t=weekText();
    openModal(head("Экспорт","График текстом")+
      `<div class="form"><textarea class="copybox" id="tgText" readonly></textarea></div>
      <div class="sh-foot"><button class="btn" id="cp">Скопировать</button>${tg&&tg.openTelegramLink?'<button class="btn primary" id="share">Отправить в чат</button>':""}</div>`,true);
    $("tgText").value=t;
    $("cp").addEventListener("click",()=>{const ta=$("tgText");
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{haptic.ok();toast("Скопировано")}).catch(()=>{ta.focus();ta.select();try{document.execCommand("copy");toast("Скопировано")}catch(_){toast("Текст выделен — скопируйте вручную")}})});
    const sh=$("share");if(sh)sh.addEventListener("click",()=>{try{tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(t))}catch(_){toast("Не удалось открыть выбор чата")}});
  }

  let tt;function toast(m,actLabel,fn){
    clearTimeout(tt);let el=document.querySelector(".toast");
    if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
    el.innerHTML="";const sp=document.createElement("span");sp.textContent=m;el.appendChild(sp);
    if(actLabel){const b=document.createElement("button");b.textContent=actLabel;b.onclick=()=>{el.remove();fn()};el.appendChild(b)}
    tt=setTimeout(()=>el.remove(),actLabel?5000:2400);
  }
  function fail(e){haptic.err();toast(e&&e.message?e.message:"Не удалось сохранить");if(e&&e.status===403){canWrite=false;render()}setTimeout(()=>load(true),0)}

  // ---------- data ----------
  function snapshot(){return{cells:Object.assign({},cells),auto:Object.assign({},auto)}}
  function restore(s){setWeek(s.cells,s.auto)}
  async function setCell(k,adminId){
    cells={...cells};if(adminId)cells[k]=adminId;else delete cells[k];
    if(auto[k]){auto={...auto};delete auto[k]}
    render();
    const wk=iso(weekStart);writing++;
    try{await api("setCell",{week:wk,key:k,admin:adminId||null})}catch(e){fail(e)}finally{writing--}
  }
  async function setWish(k,v){
    wish={...wish};if(v)wish[k]=v;else delete wish[k];render();
    writing++;try{await api("setWish",{week:iso(weekStart),key:k,value:v||null})}catch(e){fail(e)}finally{writing--}
  }
  async function setWeek(map,autoMap){
    cells={...map};auto={...(autoMap||{})};render();writing++;
    try{await api("setWeek",{week:iso(weekStart),cells:map,auto:autoMap||{}});return true}
    catch(e){fail(e);return false}
    finally{writing--}
  }
  async function clearWish(){
    const keys=Object.keys(wish);if(!keys.length){toast("«Дано» на этой неделе пустое");return}
    const old=wish;wish={};render();writing++;
    try{for(const k of keys)await api("setWish",{week:iso(weekStart),key:k,value:null});toast("«Дано» очищено")}catch(e){wish=old;fail(e)}finally{writing--}
  }
  function status(ok,txt){$("sdot").className="dot "+(ok?"live":"off");$("stext").textContent=txt}

  async function load(silent){
    const seq=++reqSeq, wk=iso(weekStart);
    if(!silent){loaded=false;cells={};wish={};auto={};render()}
    try{
      const r=await api("state",{week:wk});
      if(seq!==reqSeq||writing)return;
      team=r.team;cells=r.cells||{};wish=r.wish||{};auto=r.auto||{};canWrite=!!r.canEdit;loaded=true;
      status(!LOCAL,LOCAL?"Демо · данные только на этом устройстве":r.canEdit?"Режим руководителя":"Только просмотр");
      const b=$("setupBanner");
      if(r.setup){b.hidden=false;b.innerHTML=`<b>Настройка: впишите свой Telegram ID в config.php</b><span>Ваш ID: <code>${esc(r.me.id)}</code>. Добавьте его в OWNER_IDS — после этого график сможете менять только вы.</span>`}
      else b.hidden=true;
      render();
    }catch(e){
      if(seq!==reqSeq)return;
      if(e.status===401||e.status===403||e.status===500&&!loaded)showGate(e);
      else status(false,"Нет связи, повторяю…");
    }
  }
  function showGate(e){
    const g=$("gate");g.hidden=false;
    if(e.status===401){$("gateTitle").textContent="Откройте через Telegram";$("gateText").textContent="График доступен только из бота SIMRACE в Telegram."}
    else if(e.status===403){$("gateTitle").textContent="Нет доступа";$("gateText").innerHTML=`Попросите руководителя добавить вас в список. Ваш Telegram ID: <code>${esc(e.body&&e.body.me?e.body.me.id:"—")}</code>`}
    else{$("gateTitle").textContent="График не настроен";$("gateText").textContent=e.message}
  }
  async function copyPrev(){
    let src={};
    try{const r=await api("state",{week:iso(addDays(weekStart,-7))});src=r.cells||{}}catch(e){toast("Не удалось загрузить прошлую неделю");return}
    const map={};Object.keys(src).forEach(k=>{const [dt,sl]=[k.slice(0,10),k.slice(11)];const [y,m,dd]=dt.split("-").map(Number);map[iso(addDays(new Date(y,m-1,dd),7))+"_"+sl]=src[k]});
    if(!Object.keys(map).length){toast("На прошлой неделе график пустой");return}
    const go=async()=>{const snap=snapshot();if(await setWeek(map,{})){haptic.ok();toast("График перенесён","Отменить",()=>restore(snap))}};
    if(Object.keys(cells).length)confirmBox("Перенести график?","На этой неделе уже есть назначения. Они будут заменены графиком прошлой недели.","Заменить",go);else go();
  }
  function goWeek(n){haptic.tap();focusDay=null;weekStart=n===0?mondayOf(new Date()):addDays(weekStart,7*n);window.scrollTo({top:0});load(false)}

  const ACT={
    suggest:openSuggest,
    copyPrev,
    exportTg:exportText,
    team:openTeam,
    thisWeek:()=>goWeek(0),
    clearWish:()=>confirmBox("Очистить «дано»?","Все отметки этой недели будут удалены. Назначенные смены останутся.","Очистить",clearWish),
    clearWk:()=>confirmBox("Очистить смены?","Все назначения этой недели будут удалены. Отметки «дано» останутся.","Очистить",async()=>{const snap=snapshot();if(await setWeek({},{}))toast("Смены очищены","Отменить",()=>restore(snap))})
  };

  // ---------- events ----------
  $("board").addEventListener("click",e=>{const c=e.target.closest(".cell");if(c)openCell(+c.dataset.d,c.dataset.s)});
  $("tbl").addEventListener("click",e=>{
    const h=e.target.closest(".t-h");if(h){haptic.tap();const i=+h.dataset.fd;focusDay=focusDay===i?null:i;render();return}
    const c=e.target.closest(".t-c");if(!c||!canWrite)return;
    if(mode==="wish")openWish(+c.dataset.d,c.dataset.a);else tableAssign(+c.dataset.d,c.dataset.a);
  });
  $("mWish").addEventListener("click",()=>{mode="wish";saveF();haptic.tap();render()});
  $("mAssign").addEventListener("click",()=>{mode="assign";saveF();haptic.tap();render()});
  $("suggestBtn").addEventListener("click",openSuggest);
  $("autoChip").addEventListener("click",approveAuto);
  $("tabTable").addEventListener("click",()=>{view="table";saveF();haptic.tap();render()});
  $("tabShifts").addEventListener("click",()=>{view="shifts";saveF();haptic.tap();render()});
  $("prev").addEventListener("click",()=>goWeek(-1));
  $("next").addEventListener("click",()=>goWeek(1));
  $("wkBtn").addEventListener("click",()=>{if(!isCurrentWeek())goWeek(0)});
  $("menuBtn").addEventListener("click",openMenu);
  ["copyPrev","exportTg","team","clearWk"].forEach(id=>{const b=$(id);if(b)b.addEventListener("click",ACT[id])});
  $("fClub").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;haptic.tap();fClub=b.dataset.club;saveF();render()});
  $("fAdm").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;haptic.tap();fAdmin=b.dataset.adm||null;saveF();render()});
  $("load").addEventListener("click",e=>{const b=e.target.closest(".lrow");if(!b)return;haptic.tap();const id=b.dataset.adm;fAdmin=fAdmin===id?null:id;if(fAdmin)view="shifts";saveF();render()});

  let sx=null,sy=null;
  $("board").addEventListener("touchstart",e=>{if(e.touches.length!==1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  $("board").addEventListener("touchend",e=>{if(sx==null)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)goWeek(dx<0?1:-1)},{passive:true});

  if(!LOCAL){
    setInterval(()=>{if(document.visibilityState==="visible"&&!root.innerHTML&&loaded)load(true)},20000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&loaded)load(true)});
  }

  render();
  if(!LOCAL&&!INIT)showGate({status:401});else load(false);
})();
</script>

</body>
</html>
